<svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Disabled glass gradient -->
    <radialGradient id="glassDark" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="40%" stop-color="#b5b5b5"/>
      <stop offset="75%" stop-color="#6f6f6f"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </radialGradient>

    <!-- Gloss highlight -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer border -->
  <circle cx="18" cy="18" r="17" fill="#8a8a8a"/>

  <!-- Glass body -->
  <circle cx="18" cy="18" r="16" fill="url(#glassDark)"/>

  <!-- Gloss overlay -->
  <path d="M2 18a16 16 0 0 1 32 0" fill="url(#gloss)"/>

  <!-- Disabled arrow -->
  <path d="M20 11 L13 18 L20 25"
        fill="none"
        stroke="#2b2b2b"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
